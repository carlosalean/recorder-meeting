[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-recorder"
version = "0.1.0"
description = "Graba reuniones de cualquier aplicación (Meet, Teams, Zoom...), las transcribe localmente y las resume con Claude."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.8",
    "faster-whisper>=1.1",
    "numpy>=1.24",
    "soundcard>=0.4.4",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
meeting-recorder = "meeting_recorder.cli:main"

[tool.setuptools]
packages = ["meeting_recorder"]

[tool.setuptools.package-data]
meeting_recorder = ["assets/*"]

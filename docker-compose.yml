# Seguimiento de reuniones: web (Next.js) + PostgreSQL.
# Uso:  copia .env.example a .env, rellénalo y ejecuta:  docker compose up -d --build
# Luego abre http://localhost:3000

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: meetings
      POSTGRES_USER: meetings
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetings}
      TZ: ${TZ:-Europe/Madrid}
      PGTZ: ${TZ:-Europe/Madrid}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Solo accesible desde tu PC (para conectarte con DBeaver, pgAdmin…).
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      # Por TCP (-h 127.0.0.1): durante la primera inicialización Postgres arranca un
      # servidor temporal solo por socket y sin -h se daría por listo antes de tiempo.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U meetings -d meetings"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://meetings:${POSTGRES_PASSWORD:-meetings}@db:5432/meetings
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      OWNER_NAME: ${OWNER_NAME:-}
      OWNER_ROLE: ${OWNER_ROLE:-}
      REUNIONES_DIR: /reuniones
      TZ: ${TZ:-Europe/Madrid}
    volumes:
      # Carpeta donde la grabadora guarda las reuniones (solo lectura).
      - ${REUNIONES_DIR:-./reuniones}:/reuniones:ro
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
